<svg class="odr-svg" viewBox="0 0 600 440" width="600" height="440" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="odr-svg-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="odr-svg-title">Illustration of the ODRMaker editor: a road model drawn over faint aerial imagery. An orange reference line runs along each road, blue lines mark lanes with their widths, a lane section boundary crosses the main road, and cyan connectors link the lanes through a junction. A side panel lists the lanes of the selected lane section.</title>
  <defs>
    <clipPath id="odr-canvas"><rect x="0" y="36" width="420" height="404"/></clipPath>
    <pattern id="odr-tiles" width="70" height="70" patternUnits="userSpaceOnUse" x="0" y="36">
      <path d="M70 0H0V70" fill="none" stroke="#e2e8f0" stroke-opacity=".07"/>
    </pattern>
    <pattern id="odr-rows" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(-20)">
      <rect width="6" height="6" fill="#1d2b24"/>
      <rect width="6" height="2" fill="#24362c"/>
    </pattern>
    <marker id="odr-arrow" viewBox="0 0 8 8" refX="6" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L8 4L0 8Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- window -->
  <rect width="600" height="440" fill="#0f172a"/>

  <g clip-path="url(#odr-canvas)">
    <!-- aerial-like underlay (abstract, desaturated) -->
    <rect x="0" y="36" width="420" height="404" fill="#1a2230"/>
    <path d="M0 36H150V150L118 230H0Z" fill="url(#odr-rows)" opacity=".9"/>
    <path d="M0 380H130V440H0Z" fill="#1f2a26"/>
    <path d="M300 380H420V440H300Z" fill="#232a33"/>
    <g fill="#2c3442">
      <rect x="18" y="176" width="42" height="30" rx="2"/><rect x="70" y="170" width="30" height="46" rx="2"/>
      <rect x="112" y="186" width="24" height="24" rx="2"/>
      <rect x="146" y="386" width="36" height="26" rx="2"/><rect x="192" y="390" width="28" height="34" rx="2"/>
      <rect x="232" y="386" width="44" height="22" rx="2"/>
      <rect x="318" y="394" width="30" height="24" rx="2"/><rect x="358" y="392" width="46" height="30" rx="2"/>
    </g>
    <g fill="#343d4d">
      <path d="M18 176h42v4H18zM70 170h30v4H70zM146 386h36v4h-36zM232 386h44v4h-44zM358 392h46v4h-46z"/>
    </g>
    <!-- parking area inside the bend -->
    <rect x="300" y="150" width="92" height="84" rx="3" fill="#232b38"/>
    <path d="M310 162V186M322 162V186M334 162V186M346 162V186M358 162V186M370 162V186M382 162V186M310 198V222M322 198V222M334 198V222M346 198V222M358 198V222M370 198V222M382 198V222" stroke="#e2e8f0" stroke-opacity=".08"/>
    <g fill="#1b2a22">
      <circle cx="170" cy="120" r="14"/><circle cx="186" cy="146" r="11"/><circle cx="160" cy="166" r="12"/>
      <circle cx="30" cy="418" r="13"/><circle cx="62" cy="404" r="15"/><circle cx="96" cy="422" r="12"/>
      <circle cx="404" cy="120" r="12"/><circle cx="280" cy="424" r="11"/>
    </g>
    <!-- roads as they appear in the imagery -->
    <g fill="none" stroke="#2a3342" stroke-width="116">
      <path d="M-10 318H430"/>
      <path d="M230 250V200A150 150 0 0 1 328.7 59L436 20"/>
    </g>
    <g fill="none" stroke="#e2e8f0" stroke-opacity=".13" stroke-width="1.5" stroke-dasharray="10 10">
      <path d="M0 293.5H146M314 293.5H420M0 345.5H420"/>
    </g>
    <rect x="0" y="36" width="420" height="404" fill="url(#odr-tiles)"/>

    <!-- lane graph overlay -->
    <g fill="#60a5fa" fill-opacity=".07">
      <rect x="0" y="266" width="420" height="104"/>
      <path d="M178 236V200A202 202 0 0 1 310.9 10.2L560 -80L588 20L346.5 107.9A98 98 0 0 0 282 200V236Z"/>
    </g>
    <!-- junction area -->
    <rect x="148.5" y="228.5" width="163" height="149" rx="6" fill="none" stroke="#22d3ee" stroke-opacity=".45" stroke-dasharray="4 4"/>
    <!-- road edges -->
    <g fill="none" stroke="#60a5fa" stroke-width="1.75">
      <path d="M0 266H148A30 30 0 0 0 178 236V200A202 202 0 0 1 310.9 10.2"/>
      <path d="M420 266H312A30 30 0 0 1 282 236V200A98 98 0 0 1 346.5 107.9L588 20"/>
      <path d="M0 370H420"/>
    </g>
    <!-- lane boundaries -->
    <g fill="none" stroke="#60a5fa" stroke-width="1.25" stroke-dasharray="8 6">
      <path d="M0 292H148M312 292H420M0 344H148M312 344H420"/>
      <path d="M204 236V200A176 176 0 0 1 319.8 34.6"/>
      <path d="M256 236V200A124 124 0 0 1 337.6 83.5L512 20"/>
    </g>
    <!-- lane section boundary -->
    <path d="M86 258V378" stroke="#e2e8f0" stroke-width="1.25" stroke-dasharray="3 3"/>
    <g>
      <rect x="44" y="236" width="84" height="18" rx="4" fill="#0f172a" fill-opacity=".85" stroke="#e2e8f0" stroke-opacity=".35"/>
      <text class="svg-small" x="86" y="249" fill="#e2e8f0" text-anchor="middle">Lane section</text>
    </g>

    <!-- junction connectors -->
    <g fill="none" stroke="#22d3ee" stroke-width="2" marker-end="url(#odr-arrow)">
      <path d="M306 279C278 279 269 262 269 240"/>
      <path d="M156 331C214 331 243 292 243 240"/>
      <path d="M191 240C191 264 184 279 158 279"/>
      <path d="M217 240C217 300 252 331 304 331"/>
    </g>

    <!-- reference lines -->
    <g fill="none" stroke="#ed7d31" stroke-width="2.5">
      <path d="M0 318H420"/>
      <path d="M230 236V200A150 150 0 0 1 328.7 59L436 20"/>
    </g>
    <g fill="none" stroke="#ed7d31" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 313L46 318L40 323M116 313L122 318L116 323M346 313L352 318L346 323"/>
      <path d="M225 222L230 216L235 222"/>
    </g>
    <!-- control points -->
    <g fill="#0f172a" stroke="#ed7d31" stroke-width="2">
      <rect x="-4" y="314" width="8" height="8" rx="1"/>
      <rect x="226" y="314" width="8" height="8" rx="1"/>
      <rect x="226" y="196" width="8" height="8" rx="1"/>
      <rect x="324.7" y="55" width="8" height="8" rx="1"/>
    </g>
    <rect x="224" y="194" width="12" height="12" rx="2" fill="none" stroke="#fff" stroke-width="1.25"/>

    <!-- lane widths -->
    <g stroke="#e2e8f0" stroke-width="1.25">
      <path d="M396 267.5V290.5M392 267.5H400M392 290.5H400"/>
      <path d="M396 293.5V316.5M392 293.5H400M392 316.5H400"/>
    </g>
    <g>
      <rect x="338" y="270" width="52" height="17" rx="4" fill="#0f172a" fill-opacity=".85"/>
      <text class="svg-small" x="364" y="282.5" fill="#e2e8f0" text-anchor="middle">3.25 m</text>
      <rect x="338" y="296" width="52" height="17" rx="4" fill="#0f172a" fill-opacity=".85"/>
      <text class="svg-small" x="364" y="308.5" fill="#e2e8f0" text-anchor="middle">3.50 m</text>
    </g>

    <!-- georeferenced origin -->
    <g fill="none" stroke="#fff" stroke-width="1.5">
      <circle cx="34" cy="70" r="7"/>
      <path d="M34 57V83M21 70H47"/>
    </g>
    <g>
      <rect x="50" y="61" width="50" height="18" rx="4" fill="#0f172a" fill-opacity=".85"/>
      <text class="svg-small" x="75" y="74" fill="#fff" text-anchor="middle">Origin</text>
    </g>
  </g>

  <!-- toolbar -->
  <rect width="600" height="36" fill="#131d33"/>
  <path d="M0 35.5H600" stroke="#26334d"/>
  <text class="svg-title" x="16" y="23" fill="#e2e8f0">ODRMaker</text>
  <g>
    <rect x="100" y="7" width="22" height="22" rx="5" fill="#1d4999"/>
    <path d="M107 12L116 19.5L111.5 20.2L109.5 24.5Z" fill="#fff"/>
    <rect x="128" y="7" width="22" height="22" rx="5" fill="#1e293b"/>
    <path d="M133 24C137 14 142 22 145 12" fill="none" stroke="#ed7d31" stroke-width="1.75" stroke-linecap="round"/>
    <rect x="156" y="7" width="22" height="22" rx="5" fill="#1e293b"/>
    <path d="M161 13H173M161 18H173M161 23H173" stroke="#60a5fa" stroke-width="1.5" stroke-linecap="round"/>
    <rect x="184" y="7" width="22" height="22" rx="5" fill="#1e293b"/>
    <path d="M189 24C193 24 195 20 195 12M201 24C197 24 195 20 195 12" fill="none" stroke="#22d3ee" stroke-width="1.75" stroke-linecap="round"/>
  </g>

  <!-- side panel -->
  <rect x="420" y="36" width="180" height="404" fill="#111b2f"/>
  <path d="M420.5 36V440" stroke="#26334d"/>
  <text class="svg-caps" x="436" y="62" fill="#94a3b8">LANE SECTION</text>
  <g>
    <rect x="432" y="72" width="156" height="26" rx="6" fill="#16213a"/>
    <path d="M442 85H456" stroke="#60a5fa" stroke-width="2"/>
    <text class="svg-small" x="464" y="89" fill="#e2e8f0">Lane 2</text>
    <text class="svg-small" x="578" y="89" fill="#94a3b8" text-anchor="end">3.25 m</text>

    <rect x="432.5" y="102.5" width="155" height="25" rx="6" fill="#1a2a4d" stroke="#3b82f6"/>
    <path d="M442 115H456" stroke="#60a5fa" stroke-width="2"/>
    <text class="svg-small" x="464" y="119" fill="#fff">Lane 1</text>
    <text class="svg-small" x="578" y="119" fill="#bfdbfe" text-anchor="end">3.50 m</text>

    <rect x="432" y="132" width="156" height="26" rx="6" fill="#16213a"/>
    <path d="M442 145H456" stroke="#60a5fa" stroke-width="2"/>
    <text class="svg-small" x="464" y="149" fill="#e2e8f0">Lane −1</text>
    <text class="svg-small" x="578" y="149" fill="#94a3b8" text-anchor="end">3.50 m</text>

    <rect x="432" y="162" width="156" height="26" rx="6" fill="#16213a"/>
    <path d="M442 175H456" stroke="#60a5fa" stroke-width="2"/>
    <text class="svg-small" x="464" y="179" fill="#e2e8f0">Lane −2</text>
    <text class="svg-small" x="578" y="179" fill="#94a3b8" text-anchor="end">3.25 m</text>
  </g>
  <text class="svg-caps" x="436" y="216" fill="#94a3b8">REFERENCE LINE</text>
  <g>
    <rect x="432" y="226" width="156" height="26" rx="6" fill="#16213a"/>
    <path d="M442 239H456" stroke="#ed7d31" stroke-width="2.5"/>
    <text class="svg-small" x="464" y="243" fill="#e2e8f0">Geometry</text>
    <text class="svg-small" x="578" y="243" fill="#94a3b8" text-anchor="end">line, arc</text>
  </g>
  <text class="svg-caps" x="436" y="280" fill="#94a3b8">JUNCTION</text>
  <g>
    <rect x="432" y="290" width="156" height="26" rx="6" fill="#16213a"/>
    <path d="M442 303H456" stroke="#22d3ee" stroke-width="2"/>
    <text class="svg-small" x="464" y="307" fill="#e2e8f0">Connections</text>
    <text class="svg-small" x="578" y="307" fill="#94a3b8" text-anchor="end">4</text>
  </g>
  <rect x="432.5" y="396.5" width="155" height="29" rx="7" fill="none" stroke="#60a5fa"/>
  <text class="svg-small" x="510" y="415" fill="#bfdbfe" text-anchor="middle">Export OpenDRIVE</text>
</svg>
