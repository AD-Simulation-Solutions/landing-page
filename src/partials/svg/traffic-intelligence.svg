<svg class="ti-svg" viewBox="0 50 600 360" width="600" height="360" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ti-svg-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="ti-svg-title">Illustration: a camera on a pole beside a road observes a road segment. Markers flag roadworks in one lane and an incident in the opposite lanes, and radio waves send a warning to an approaching connected vehicle (V2X).</title>
  <defs>
    <pattern id="ti-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#94a3b8" stroke-opacity=".08"/>
    </pattern>
    <pattern id="ti-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="8" height="8" fill="#ed7d31" fill-opacity=".12"/>
      <rect width="3" height="8" fill="#ed7d31" fill-opacity=".55"/>
    </pattern>
  </defs>

  <!-- ground -->
  <rect width="600" height="440" fill="#101a2e"/>
  <rect width="600" height="440" fill="url(#ti-grid)"/>

  <!-- road -->
  <rect x="0" y="230" width="600" height="120" fill="#1b263d"/>
  <path d="M0 230.75H600M0 349.25H600" stroke="#5f6f8d" stroke-width="1.5"/>
  <path d="M0 290H600" stroke="#5f6f8d" stroke-width="2"/>
  <path d="M0 260H600M0 320H600" stroke="#475673" stroke-width="1.5" stroke-dasharray="12 12"/>

  <!-- camera field of view onto the observed segment -->
  <path d="M176 102L196 350H548V230Z" fill="#93c5fd" fill-opacity=".06"/>
  <path d="M176 102L196 350M176 102L548 230" fill="none" stroke="#93c5fd" stroke-opacity=".4" stroke-dasharray="3 5"/>
  <g fill="none" stroke="#93c5fd" stroke-opacity=".7" stroke-width="1.5">
    <path d="M196 244V232H210M534 232H546V244M546 336V348H534M210 348H196V336"/>
  </g>

  <!-- roadworks: closed lane with taper and cones -->
  <path d="M472 232L432 259H330V232Z" fill="url(#ti-hatch)"/>
  <rect x="325.5" y="226.5" width="152" height="37" rx="2" fill="none" stroke="#ed7d31" stroke-width="1.25"/>
  <g fill="#ed7d31">
    <circle cx="466" cy="236" r="3.2"/><circle cx="456" cy="243" r="3.2"/><circle cx="446" cy="250" r="3.2"/><circle cx="436" cy="257" r="3.2"/>
    <circle cx="412" cy="258" r="3.2"/><circle cx="388" cy="258" r="3.2"/><circle cx="364" cy="258" r="3.2"/><circle cx="340" cy="258" r="3.2"/>
  </g>
  <g fill="#fff"><circle cx="466" cy="236" r="1.1"/><circle cx="456" cy="243" r="1.1"/><circle cx="446" cy="250" r="1.1"/><circle cx="436" cy="257" r="1.1"/><circle cx="412" cy="258" r="1.1"/><circle cx="388" cy="258" r="1.1"/><circle cx="364" cy="258" r="1.1"/><circle cx="340" cy="258" r="1.1"/></g>
  <!-- roadworks marker -->
  <g>
    <path d="M394 212L401 222L408 212Z" fill="#ed7d31"/>
    <rect x="385" y="182" width="32" height="31" rx="8" fill="#ed7d31"/>
    <path d="M401 188L409.5 206H392.5Z" fill="#fff"/>
    <path d="M396.3 198H405.7" stroke="#ed7d31" stroke-width="2.4"/>
    <rect x="390" y="205" width="22" height="3" rx="1" fill="#fff"/>
  </g>

  <!-- incident: two stopped vehicles -->
  <g>
    <g transform="rotate(16 246 306)">
      <rect x="231" y="298.5" width="30" height="15" rx="4" fill="#cbd5e1"/>
      <rect x="251" y="300.5" width="6" height="11" rx="1.5" fill="#1e293b"/>
    </g>
    <g transform="rotate(-10 272 334)">
      <rect x="257" y="326.5" width="30" height="15" rx="4" fill="#cbd5e1"/>
      <rect x="277" y="328.5" width="6" height="11" rx="1.5" fill="#1e293b"/>
    </g>
    <rect x="222.5" y="290.5" width="74" height="56" rx="2" fill="none" stroke="#f87171" stroke-width="1.25" stroke-dasharray="4 3"/>
    <path d="M253 368L260 358L267 368Z" fill="#ef4444"/>
    <rect x="244" y="367" width="32" height="31" rx="8" fill="#ef4444"/>
    <rect x="258.2" y="374" width="3.6" height="12" rx="1.8" fill="#fff"/>
    <circle cx="260" cy="391" r="2.2" fill="#fff"/>
  </g>

  <!-- regular traffic, tracked -->
  <g>
    <rect x="486" y="267.5" width="30" height="15" rx="4" fill="#cbd5e1"/>
    <rect x="488" y="269.5" width="6" height="11" rx="1.5" fill="#1e293b"/>
    <rect x="480.5" y="262.5" width="41" height="25" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.25"/>
  </g>
  <g>
    <rect x="404" y="297.5" width="30" height="15" rx="4" fill="#cbd5e1"/>
    <rect x="424" y="299.5" width="6" height="11" rx="1.5" fill="#1e293b"/>
    <rect x="398.5" y="292.5" width="41" height="25" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.25"/>
  </g>
  <g>
    <rect x="112" y="327.5" width="30" height="15" rx="4" fill="#94a3b8" fill-opacity=".8"/>
    <rect x="132" y="329.5" width="6" height="11" rx="1.5" fill="#1e293b"/>
  </g>

  <!-- connected vehicle approaching the roadworks -->
  <g>
    <rect x="552" y="237.5" width="30" height="15" rx="4" fill="#e2e8f0"/>
    <rect x="554" y="239.5" width="6" height="11" rx="1.5" fill="#1e293b"/>
    <g fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
      <path d="M559 229A13 13 0 0 1 575 229"/>
      <path d="M553 222A22 22 0 0 1 581 222"/>
    </g>
  </g>

  <!-- V2X link from the roadside unit -->
  <path class="v2x-link" d="M150 128Q380 110 552 228" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round"/>
  <g>
    <rect x="343" y="137" width="44" height="20" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.25"/>
    <text class="svg-label" x="365" y="151" fill="#7dd3fc" text-anchor="middle">V2X</text>
  </g>

  <!-- pole with camera and roadside unit -->
  <g>
    <ellipse cx="112" cy="217" rx="12" ry="3.5" fill="#020617" fill-opacity=".6"/>
    <rect x="109" y="72" width="6" height="146" rx="3" fill="#64748b"/>
    <rect x="112" y="74" width="48" height="5" rx="2.5" fill="#64748b"/>
    <g transform="translate(160 90) rotate(35)">
      <rect x="-12" y="-10" width="30" height="4" rx="2" fill="#cbd5e1"/>
      <rect x="-10" y="-7" width="26" height="14" rx="3" fill="#e2e8f0"/>
      <rect x="15" y="-5" width="5" height="10" rx="1.5" fill="#94a3b8"/>
    </g>
    <rect x="115" y="140" width="14" height="24" rx="2" fill="#cbd5e1"/>
    <rect x="118" y="146" width="8" height="2" rx="1" fill="#475569"/>
    <rect x="118" y="151" width="8" height="2" rx="1" fill="#475569"/>
    <path d="M122 140V127" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    <circle cx="122" cy="126" r="2.5" fill="#38bdf8"/>
    <g fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round">
      <path d="M131 119A11 11 0 0 1 131 133"/>
      <path d="M137 113A19 19 0 0 1 137 139"/>
    </g>
  </g>
</svg>
