<svg class="hero-svg" viewBox="0 0 600 500" width="600" height="500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="hero-svg-title" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="hero-svg-title">Illustration: top-down view of an intersection seen by a roadside camera. Every road user — cars, a truck, a cyclist and a pedestrian — has a bounding box and a trajectory. One car, turning left across oncoming traffic, is highlighted as the ego vehicle.</title>
  <defs>
    <pattern id="hg-grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M20 0H0V20" fill="none" stroke="#94a3b8" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <clipPath id="hg-clip"><rect width="600" height="500" rx="16"/></clipPath>
  </defs>
  <g clip-path="url(#hg-clip)">
    <!-- asphalt -->
    <rect width="600" height="500" fill="#1b263d"/>
    <!-- city blocks with rounded curbs -->
    <g fill="#101a2e" stroke="#2e3d5c" stroke-width="1.5">
      <rect x="-40" y="-40" width="284" height="234" rx="26"/>
      <rect x="356" y="-40" width="284" height="234" rx="26"/>
      <rect x="-40" y="306" width="284" height="234" rx="26"/>
      <rect x="356" y="306" width="284" height="234" rx="26"/>
    </g>
    <g fill="url(#hg-grid)">
      <rect x="-40" y="-40" width="284" height="234" rx="26"/>
      <rect x="356" y="-40" width="284" height="234" rx="26"/>
      <rect x="-40" y="306" width="284" height="234" rx="26"/>
      <rect x="356" y="306" width="284" height="234" rx="26"/>
    </g>

    <!-- lane markings -->
    <g fill="none" stroke="#5f6f8d" stroke-width="2">
      <path d="M300 0V162M300 338V500M0 250H202M398 250H600"/>
    </g>
    <g fill="none" stroke="#475673" stroke-width="1.5" stroke-dasharray="12 12">
      <path d="M272 0V162M328 0V162M272 338V500M328 338V500"/>
      <path d="M0 222H202M0 278H202M398 222H600M398 278H600"/>
    </g>
    <!-- stop lines -->
    <g stroke="#8a99b4" stroke-width="3" stroke-opacity=".7">
      <path d="M246 164H299M301 336H354M204 251V304M396 196V249"/>
    </g>
    <!-- crosswalks -->
    <g fill="#cbd5e1" fill-opacity=".16">
      <path d="M248 170h6v18h-6zM260 170h6v18h-6zM272 170h6v18h-6zM284 170h6v18h-6zM296 170h6v18h-6zM308 170h6v18h-6zM320 170h6v18h-6zM332 170h6v18h-6zM344 170h6v18h-6z"/>
      <path d="M248 312h6v18h-6zM260 312h6v18h-6zM272 312h6v18h-6zM284 312h6v18h-6zM296 312h6v18h-6zM308 312h6v18h-6zM320 312h6v18h-6zM332 312h6v18h-6zM344 312h6v18h-6z"/>
      <path d="M210 198h18v6h-18zM210 210h18v6h-18zM210 222h18v6h-18zM210 234h18v6h-18zM210 246h18v6h-18zM210 258h18v6h-18zM210 270h18v6h-18zM210 282h18v6h-18zM210 294h18v6h-18z"/>
      <path d="M372 198h18v6h-18zM372 210h18v6h-18zM372 222h18v6h-18zM372 234h18v6h-18zM372 246h18v6h-18zM372 258h18v6h-18zM372 270h18v6h-18zM372 282h18v6h-18zM372 294h18v6h-18z"/>
    </g>

    <!-- camera field of view -->
    <path d="M404 352L75 264A340 340 0 0 1 316 24Z" fill="#e2e8f0" fill-opacity=".035" stroke="#e2e8f0" stroke-opacity=".22" stroke-width="1" stroke-dasharray="3 5"/>

    <!-- trajectories: past (dotted history) -->
    <g fill="none" stroke-width="3" stroke-linecap="round" stroke-dasharray="0 12" class="traj-p">
      <path d="M314 500V412" stroke="#ed7d31"/>
      <path d="M286 0V96" stroke="#60a5fa"/>
      <path d="M600 208H496" stroke="#22d3ee"/>
      <path d="M0 298H102" stroke="#a78bfa"/>
      <path d="M219 330V280" stroke="#34d399"/>
    </g>
    <!-- trajectories: planned / future (animated dashes) -->
    <g fill="none" stroke-width="2.5" stroke-linecap="round" class="traj-f">
      <path d="M314 372V318C314 268 286 236 238 236H0" stroke="#ed7d31"/>
      <path d="M286 144V500" stroke="#60a5fa"/>
      <path d="M440 208H382C360 208 342 192 342 170V0" stroke="#22d3ee"/>
      <path d="M138 298H600" stroke="#a78bfa"/>
      <path d="M219 256V150" stroke="#34d399"/>
    </g>

    <!-- predicted conflict -->
    <circle class="conflict" cx="289" cy="244" r="15" fill="#ed7d31" fill-opacity=".12" stroke="#ed7d31" stroke-width="1.5" stroke-dasharray="4 3"/>

    <!-- road users + bounding boxes -->
    <!-- oncoming car (southbound) -->
    <g>
      <rect x="278" y="106" width="16" height="28" rx="4" fill="#cbd5e1"/>
      <rect x="280" y="122" width="12" height="6" rx="1.5" fill="#1e293b"/>
      <rect x="280" y="109" width="12" height="4" rx="1" fill="#1e293b" fill-opacity=".7"/>
      <rect x="272.5" y="100.5" width="27" height="39" rx="2" fill="none" stroke="#60a5fa" stroke-width="1.25"/>
      <g class="tag"><rect x="238" y="100.5" width="31" height="14" rx="2" fill="#60a5fa" fill-opacity=".18"/><text x="253.5" y="111" fill="#93c5fd" text-anchor="middle">CAR</text></g>
    </g>
    <!-- truck (westbound, turning right) -->
    <g>
      <rect x="459" y="199" width="34" height="18" rx="2" fill="#cbd5e1"/>
      <rect x="445" y="200.5" width="12" height="15" rx="3" fill="#e2e8f0"/>
      <rect x="446.5" y="202.5" width="4" height="11" rx="1" fill="#1e293b"/>
      <rect x="439.5" y="193.5" width="59" height="29" rx="2" fill="none" stroke="#22d3ee" stroke-width="1.25"/>
      <g class="tag"><rect x="439.5" y="176" width="42" height="14" rx="2" fill="#22d3ee" fill-opacity=".16"/><text x="460.5" y="186.5" fill="#67e8f9" text-anchor="middle">TRUCK</text></g>
    </g>
    <!-- cyclist (eastbound) -->
    <g>
      <rect x="108" y="296" width="22" height="4" rx="2" fill="#94a3b8"/>
      <ellipse cx="117" cy="298" rx="4" ry="6" fill="#e2e8f0"/>
      <rect x="102.5" y="288.5" width="33" height="19" rx="2" fill="none" stroke="#a78bfa" stroke-width="1.25"/>
      <g class="tag"><rect x="102.5" y="271" width="33" height="14" rx="2" fill="#a78bfa" fill-opacity=".18"/><text x="119" y="281.5" fill="#c4b5fd" text-anchor="middle">BIKE</text></g>
    </g>
    <!-- pedestrian (crossing, occluded from the ego by the oncoming car) -->
    <g>
      <ellipse cx="219" cy="268" rx="6.5" ry="3.5" fill="#94a3b8"/>
      <circle cx="219" cy="268" r="3.6" fill="#e2e8f0"/>
      <rect x="209.5" y="258.5" width="19" height="19" rx="2" fill="none" stroke="#34d399" stroke-width="1.25"/>
      <g class="tag"><rect x="174" y="263" width="31" height="14" rx="2" fill="#34d399" fill-opacity=".16"/><text x="189.5" y="273.5" fill="#6ee7b7" text-anchor="middle">PED</text></g>
    </g>
    <!-- ego car (northbound, unprotected left turn) -->
    <g>
      <rect x="306" y="378" width="16" height="28" rx="4" fill="#ed7d31"/>
      <rect x="308" y="383" width="12" height="6" rx="1.5" fill="#0f172a"/>
      <rect x="308" y="398" width="12" height="4" rx="1" fill="#0f172a" fill-opacity=".7"/>
      <rect x="300.5" y="372.5" width="27" height="39" rx="2" fill="none" stroke="#ed7d31" stroke-width="1.5"/>
      <rect x="331" y="372.5" width="34" height="16" rx="3" fill="#ed7d31"/>
      <text class="ego-label" x="348" y="384.5" fill="#0f172a" text-anchor="middle">EGO</text>
    </g>

    <!-- roadside camera on a pole -->
    <g>
      <circle cx="404" cy="352" r="7" fill="#0f172a" stroke="#94a3b8" stroke-width="1.5"/>
      <g transform="translate(404 352) rotate(225)">
        <rect x="-3" y="-6" width="20" height="12" rx="2.5" fill="#e2e8f0"/>
        <rect x="16" y="-4" width="5" height="8" rx="1.5" fill="#94a3b8"/>
      </g>
    </g>
  </g>
  <rect x=".5" y=".5" width="599" height="499" rx="15.5" fill="none" stroke="#94a3b8" stroke-opacity=".22"/>
</svg>
